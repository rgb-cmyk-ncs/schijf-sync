name: Build Windows app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${GITHUB_SHA::7}" -o SchijfSync.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: SchijfSync-exe
          path: SchijfSync.exe

      # Always-current download link:
      # https://github.com/<you>/<repo>/releases/download/latest/SchijfSync.exe
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest SchijfSync.exe --title "Latest build" --notes "Built from ${GITHUB_SHA}" --target "${GITHUB_SHA}"
